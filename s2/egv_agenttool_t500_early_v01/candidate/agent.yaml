agent_class: LlmAgent
name: main_coding_agent
model: gemma-4-31b-it-qat-w4a16-ct
description: Main coding agent with on-demand EGV verification
instruction: !include prompts/main.md
tools:
  - get_status
  - run_command
  - read_file
  - edit_file
  - write_file
  - submit_patch
  - agent_tool:
      config_path: sub_agents/egv_verifier.yaml
      skip_summarization: false
generate_content_config:
  max_output_tokens: 16384
  seed: 17
  thinking_config:
    thinking_budget: 4096
